<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- OGP画像（1200×630）の原本。再出力手順は同じフォルダの README.md -->
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{position:relative;box-sizing:border-box;background:#111317;color:#EDEAE2;
    font-family:"Yu Gothic","YuGothic","Meiryo",sans-serif;
    background-image:radial-gradient(ellipse 70% 90% at 100% 0%,#1A1D22 0%,#111317 70%);
    border-left:14px solid #B8912F}
  .in{position:absolute;left:84px;right:84px;top:0;bottom:130px;display:flex;flex-direction:column;justify-content:center}
  .eye{margin:0 0 30px;font-size:24px;font-weight:700;letter-spacing:.08em;color:#B8912F;display:flex;align-items:center;gap:16px}
  .eye::before{content:"";width:40px;height:3px;background:#B8912F;display:block}
  h1{margin:0;font-family:"Yu Mincho","YuMincho",serif;font-weight:700;font-size:78px;line-height:1.3;letter-spacing:.02em}
  h1 .hl{color:#C9A24A}
  .sub{margin:30px 0 0;font-size:25px;color:#9E9A90;letter-spacing:.04em}
  .foot{position:absolute;left:84px;right:84px;bottom:46px;display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid rgba(255,255,255,.12);padding-top:26px}
  .foot img{height:46px;display:block}
  .foot span{font-family:Consolas,monospace;font-size:21px;color:#9E9A90;letter-spacing:.03em}
</style></head>
<body>
  <div class="in">
    <p class="eye">一気通貫で担う M&amp;A キャリア</p>
    <h1>大きな一件を、<br><span class="hl">自分の名前でまとめる。</span></h1>
    <p class="sub">M&amp;A仲介への転職支援｜未経験からの入口と、向き不向きまで</p>
  </div>
  <div class="foot"><img src="../../logo-white.png" alt="エージェントベスト"><span>ma.agent-best.net</span></div>
</body></html>
